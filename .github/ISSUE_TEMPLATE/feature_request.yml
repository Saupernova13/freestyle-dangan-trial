name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web editor
        - Godot engine
        - Both / the .drtrial format
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the authoring or gameplay need, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working. Mockups and examples welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
