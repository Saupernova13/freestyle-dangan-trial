name: Engine

on:
  push:
    paths:
      - 'freestyle-dangan-trial/**'
      - 'schema/**'
      - '.github/workflows/engine.yml'
  pull_request:
    paths:
      - 'freestyle-dangan-trial/**'
      - 'schema/**'
      - '.github/workflows/engine.yml'

env:
  GODOT_VERSION: 4.5.1

jobs:
  no-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The engine is GDScript-only. Addons occasionally vendor a .cs file, and
      # the .NET Godot editor then refuses to export without a C# solution. The
      # standard build this workflow installs ignores .cs entirely, so nothing
      # else here would notice.
      - name: Reject C#/.NET files
        run: |
          found=$(find freestyle-dangan-trial \
            \( -name '*.cs' -o -name '*.csproj' -o -name '*.sln' \) \
            -not -path '*/.godot/*' -print)
          if [ -n "$found" ]; then
            echo "::error::C#/.NET files are not allowed in the engine project:"
            printf '%s\n' "$found"
            exit 1
          fi

  gdlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install "gdtoolkit==4.5.*"
      # gdlint discovers gdlintrc from the working directory, so lint from
      # inside the engine dir where the config lives.
      - run: gdlint scripts tests
        working-directory: freestyle-dangan-trial

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          install -D "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
      - name: Import project
        # .godot/ is gitignored, so CI must import from scratch (this also
        # resolves the uid:// main-scene reference). A cold first import can
        # exit nonzero on resource ordering; the second pass is a cheap no-op
        # when the first succeeded.
        run: |
          godot --headless --path freestyle-dangan-trial --import || \
          godot --headless --path freestyle-dangan-trial --import
      - name: Run gdUnit4 tests
        env:
          GODOT_BIN: /home/runner/.local/bin/godot
        working-directory: freestyle-dangan-trial
        # --headless (engine flag) because the runner has no display;
        # --ignoreHeadlessMode opts out of gdUnit4's headless refusal.
        run: bash addons/gdUnit4/runtest.sh -a res://tests/unit --headless --ignoreHeadlessMode
