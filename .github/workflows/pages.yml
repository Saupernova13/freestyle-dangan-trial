name: Deploy editor to Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-ui-editor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui-editor
    steps:
      - uses: actions/checkout@v4
      # Best effort: the default workflow token often may not create the
      # Pages site. If this step fails, enable Pages once by hand
      # (Settings -> Pages -> Source: GitHub Actions) and re-run.
      - name: Enable Pages for the repo if not yet configured
        uses: actions/configure-pages@v6
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui-editor/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-ui-editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
