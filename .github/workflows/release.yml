name: Release

# Builds the Windows and Android engine binaries for each version tag and
# attaches them to the GitHub release. The web editor ships via GitHub Pages,
# not here.
#
# workflow_dispatch runs the export jobs as a build-only dry run; the publish
# job is gated on tag refs so dispatch never creates a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7

jobs:
  windows-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          install -D "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Stamp version from tag
        # Android orders updates by versionCode, and both it and versionName
        # were left at their defaults - every release looked like version 1.
        run: .github/scripts/stamp-version.sh
      - name: Import project
        # Cold first import can exit nonzero while resources settle; the second
        # pass is a cheap no-op when the first already succeeded.
        run: |
          godot --headless --path freestyle-dangan-trial --import || \
          godot --headless --path freestyle-dangan-trial --import
      - name: Export Windows build
        # Godot can segfault on shutdown after a successful headless export
        # (it polls adb for one-click-deploy devices), so gate success on the
        # output file instead of the exit code.
        run: |
          mkdir -p freestyle-dangan-trial/builds/win
          godot --headless --path freestyle-dangan-trial --export-release "Windows" builds/win/trial.exe || true
          exe="freestyle-dangan-trial/builds/win/trial.exe"
          test -f "$exe" && [ "$(stat -c%s "$exe")" -gt 1000000 ] \
            || { echo "Windows export did not produce a valid exe"; exit 1; }
          ls -lh freestyle-dangan-trial/builds/win/
      - name: Zip build
        run: |
          cd freestyle-dangan-trial/builds/win
          zip -r "$GITHUB_WORKSPACE/CustomRonpa-windows-${GITHUB_REF_NAME}.zip" .
      - uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: CustomRonpa-windows-*.zip
          if-no-files-found: error

  android-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and export templates
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          install -D "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/.local/bin/godot"
          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Generate debug keystore and configure Godot editor settings
        # The prebuilt-template Android export signs with the debug keystore and
        # finds the SDK/keystore through the editor settings file. The GitHub
        # runner ships the Android SDK at $ANDROID_SDK_ROOT.
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$HOME/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 10000 -deststoretype pkcs12
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"${ANDROID_SDK_ROOT}\""
            echo "export/android/debug_keystore = \"${HOME}/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-4.tres"
      - name: Stamp version from tag
        # Android orders updates by versionCode, and both it and versionName
        # were left at their defaults - every release looked like version 1.
        run: .github/scripts/stamp-version.sh
      - name: Import project
        run: |
          godot --headless --path freestyle-dangan-trial --import || \
          godot --headless --path freestyle-dangan-trial --import
      - name: Export Android build
        # Same shutdown segfault as the Windows job: the APK is built and signed
        # by apksigner before Godot crashes on exit, so gate on the output file.
        run: |
          mkdir -p freestyle-dangan-trial/builds/android
          godot --headless --path freestyle-dangan-trial --export-debug "Android" builds/android/CustomRonpa.apk || true
          apk="freestyle-dangan-trial/builds/android/CustomRonpa.apk"
          test -f "$apk" && [ "$(stat -c%s "$apk")" -gt 1000000 ] \
            || { echo "Android export did not produce a valid apk"; exit 1; }
          ls -lh freestyle-dangan-trial/builds/android/
          cp "$apk" "CustomRonpa-android-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-build
          path: CustomRonpa-android-*.apk
          if-no-files-found: error

  release:
    needs: [windows-export, android-export]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            CustomRonpa-windows-*.zip
            CustomRonpa-android-*.apk
