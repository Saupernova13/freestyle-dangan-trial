name: Release

# Ships the single-file editor HTML for each version tag. A prebuilt Windows
# engine binary is intentionally not produced here: the main scene depends on
# the large texture/mesh assets that are gitignored (see .gitignore), so a
# clean CI checkout cannot resolve them and `--export-release` crashes on the
# missing resources. Engine builds are exported locally from a full checkout.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui-editor/package-lock.json
      - run: npm ci
      - run: npm run build:single
      - run: cp dist/index.html "trial-editor-${{ github.ref_name }}.html"
      - uses: actions/upload-artifact@v4
        with:
          name: editor
          path: web-ui-editor/trial-editor-${{ github.ref_name }}.html

  release:
    needs: [editor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            trial-editor-${{ github.ref_name }}.html
