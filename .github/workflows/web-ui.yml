name: Web UI

on:
  push:
    paths:
      - 'web-ui-editor/**'
      - '.github/workflows/web-ui.yml'
  pull_request:
    paths:
      - 'web-ui-editor/**'
      - '.github/workflows/web-ui.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui-editor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
