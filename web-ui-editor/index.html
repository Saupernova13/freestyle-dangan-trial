<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Danganronpa Cast Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-theme="light">
  <header>
    <h1>Danganronpa Cast Manager</h1>
    <div class="header-actions">
      <button class="settings-toggle" onclick="openSettings()" title="Settings">
        <span>⚙️</span>
      </button>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <span class="theme-icon">🌙</span>
      </button>
    </div>
  </header>
  
  <div class="trialbar">
    <label for="trialNameInput">Trial Name:</label>
    <input id="trialNameInput" maxlength="60" placeholder="Enter trial name..." spellcheck="false">
    <div class="dir-actions">
      <button class="btn btn-primary" onclick="chooseTrialDir()">
        📁 Choose Folder
      </button>
      <span id="dirDisplay"></span>
    </div>
  </div>

  <main>
    <nav>
      <div class="nav-item selected" data-view="cast" onclick="switchView('cast')">
        <span class="icon">👥</span>
        <span>Cast</span>
      </div>
      <div class="nav-item" data-view="script" onclick="switchView('script')">
        <span class="icon">📝</span>
        <span>Script</span>
      </div>
      <div class="nav-item" data-view="truthBullets" onclick="switchView('truthBullets')">
        <span class="icon">🎯</span>
        <span>Truth Bullets</span>
      </div>
      <div class="nav-item" data-view="minigames" onclick="switchView('minigames')">
        <span class="icon">🎮</span>
        <span>Minigame Details</span>
      </div>
    </nav>
    
    <div style="flex: 1; min-width: 0;">
      <div id="mainGrid"></div>
    </div>
  </main>

  <div id="modalroot"></div>
  <div id="loaderOverlay">
    <div class="spinner"></div>
  </div>

  <!-- Core (no dependencies) -->
  <script src="js/core/constants.js"></script>
  <script src="js/core/state.js"></script>

  <!-- Utilities (depend on constants/state) -->
  <script src="js/utils.js"></script>
  <script src="js/ui/theme.js"></script>

  <!-- Components -->
  <script src="js/components/floatingAddButton.js"></script>

  <!-- Models (depend on state) -->
  <script src="js/models/characterModel.js"></script>

  <!-- Storage (depends on state, utils) -->
  <script src="js/core/storage.js"></script>

  <!-- Views (depend on state, models) -->
  <script src="js/views/castView.js"></script>

  <!-- Minigame editor modules (load before minigameView) -->
  <script src="js/views/minigames/nonstopDebateEditor.js"></script>
  <script src="js/views/minigames/logicDiveEditor.js"></script>
  <script src="js/views/minigames/debateScrumEditor.js"></script>
  <script src="js/views/minigames/massPanicDebateEditor.js"></script>
  <script src="js/views/minigames/hangmansGambitEditor.js"></script>

  <script src="js/views/minigameView.js"></script>
  <script src="js/views/truthBulletsView.js"></script>
  <script src="js/views/viewManager.js"></script>

  <!-- Settings -->
  <script src="js/settings.js"></script>

  <!-- Modals (depend on everything) -->
  <script src="js/modals/modalCoordinator.js"></script>
  <script src="js/modals/characterModal.js"></script>
  <script src="js/modals/truthBulletModal.js"></script>
  <script src="js/modals/scriptLineModal.js"></script>

  <!-- Main app (initialization only) -->
  <script src="js/app.js"></script>
</body>
</html>
