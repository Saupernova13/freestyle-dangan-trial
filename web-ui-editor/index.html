<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Class Trial Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-theme="dark">
    <header>
      <h1>Class Trial Editor</h1>
      <div class="header-actions">
        <span id="saveStatus" class="save-status" aria-live="polite"></span>
        <button class="settings-toggle" onclick="openSettings()" title="Settings">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div class="trialbar">
      <label for="trialNameInput">Trial Name</label>
      <input
        id="trialNameInput"
        maxlength="60"
        placeholder="Enter trial name..."
        spellcheck="false"
      />
      <div class="dir-actions">
        <button class="btn btn-primary" onclick="chooseTrialDir()">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon"
            aria-hidden="true"
          >
            <path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          </svg>
          Choose Folder
        </button>
        <button
          class="btn btn-success"
          onclick="exportToPlayableFile()"
          id="exportBtn"
          disabled
          title="Export trial to .drtrial file"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon"
            aria-hidden="true"
          >
            <path d="M21 8v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8" />
            <path d="m3 8 9-5 9 5" />
            <path d="M12 3v11" />
            <path d="m9 11 3 3 3-3" />
          </svg>
          Export to Playable File
        </button>
        <span id="dirDisplay"></span>
      </div>
    </div>

    <main>
      <nav>
        <div class="nav-item selected" data-view="cast" onclick="switchView('cast')" role="button" tabindex="0">
          <svg
            class="icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M16 19v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 19v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <span>Cast</span>
        </div>
        <div class="nav-item" data-view="script" onclick="switchView('script')" role="button" tabindex="0">
          <svg
            class="icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 3h10l4 4v14H5z" />
            <path d="M15 3v4h4" />
            <path d="M8 13h8M8 17h8M8 9h3" />
          </svg>
          <span>Script</span>
        </div>
        <div class="nav-item" data-view="truthBullets" onclick="switchView('truthBullets')" role="button" tabindex="0">
          <svg
            class="icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9" />
            <circle cx="12" cy="12" r="5" />
            <circle cx="12" cy="12" r="1.5" />
          </svg>
          <span>Truth Bullets</span>
        </div>
        <div class="nav-item" data-view="minigames" onclick="switchView('minigames')" role="button" tabindex="0">
          <svg
            class="icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="2" y="6" width="20" height="12" rx="5" />
            <path d="M7 12h4M9 10v4" />
            <circle cx="16" cy="11" r="1" />
            <circle cx="18.5" cy="13.5" r="1" />
          </svg>
          <span>Minigames</span>
        </div>
      </nav>

      <div style="flex: 1; min-width: 0">
        <div id="mainGrid"></div>
      </div>
    </main>

    <div id="modalroot"></div>
    <div id="dialogroot"></div>
    <div id="toastroot"></div>
    <div id="loaderOverlay">
      <div class="spinner"></div>
      <div class="loader-text" id="loaderText"></div>
    </div>

    <!-- Single ES-module entry point; js/main.js imports every module and
       bridges public handlers onto window for the inline onclick markup. -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
